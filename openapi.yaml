openapi: 3.0.3
info:
  title: «Дизайнер» API
  version: 1.0.0
  description: |
    REST API вебплатформи персоналізованих товарів «Дизайнер».

    Контракт є спільним для frontend і backend. Правила:
    - JSON, camelCase, UTF-8.
    - Гроші в цілих копійках (`*Minor`), валюта UAH.
    - Час ISO 8601 UTC.
    - Помилки мають форму `{ "error": { "code", "message", "details", "requestId" } }`.
    - Списки посторінкові: `{ items, page, limit, total, hasMore }`.
    - Access JWT 15 хвилин, refresh token у HttpOnly cookie 7 діб.
    - Ролі перевіряються backend-ом; розширення `x-required-roles` описує мінімум.
  contact:
    name: Команда «Стиляги»
    email: gtsasuk@gmail.com
  license:
    name: Educational project
servers:
  - url: /api
    description: Production same-origin (SvelteKit proxy)
  - url: http://localhost:8787
    description: Local Hono worker
tags:
  - name: Auth
    description: Реєстрація, вхід, refresh, відновлення пароля
  - name: Users
    description: Профіль, компанія, файли, винагорода, сповіщення
  - name: Config
    description: Публічні шрифти, ліміти та версії текстів
  - name: Catalog
    description: Категорії, товари, опубліковані дизайни, пошук
  - name: Delivery
    description: Довідники та розрахунок Нової Пошти
  - name: Cart
    description: Розрахунок кошика без збереження на сервері
  - name: Uploads
    description: Signed upload, перевірка файлів, видалення
  - name: Designs
    description: Чернетки, fork, публікація, статистика, скарги
  - name: Personalization
    description: Списки імен і перевірка найдовшого імені
  - name: Orders
    description: Замовлення, скасування, рахунок, відправлення
  - name: Payments
    description: Платіжні посилання, статуси, webhook
  - name: Moderation
    description: Черги дизайнів і замовлень, скарги
  - name: Admin
    description: Каталог, замовлення, друк, користувачі, аудит
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Config]
      operationId: getHealth
      summary: Перевірка живості та доступності БД
      description: |
        Використовується uptime-монітором і GitHub Action keep-alive.
        Не вимагає авторизації, не розкриває секретів.
      security: []
      responses:
        '200':
          description: Сервіс живий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Реєстрація покупця
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Акаунт створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Вхід за email і паролем
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Сесія створена, refresh token у Set-Cookie
          headers:
            Set-Cookie:
              schema:
                type: string
              description: refresh_token=...; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Ротація refresh token
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Новий access token
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Вихід і відкликання сесії
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Сесію завершено

  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Запит на відновлення пароля
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Лист надіслано або email не існує (відповідь однакова)
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Встановлення нового пароля за токеном
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
                  pattern: '^(?=.*[0-9]).{8,72}$'
      responses:
        '204':
          description: Пароль змінено
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Підтвердження email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email підтверджено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/oauth/google:
    post:
      tags: [Auth]
      operationId: loginWithGoogle
      summary: Вхід через Google ID token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
      responses:
        '200':
          description: Сесія створена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Поточний користувач і права
      responses:
        '200':
          description: Профіль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    patch:
      tags: [Users]
      operationId: updateMyProfile
      summary: Оновлення профілю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Оновлений профіль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Users]
      operationId: deleteMyAccount
      summary: Видалення акаунта
      description: Акаунт блокується, персональні дані анонімізуються протягом 30 днів.
      responses:
        '202':
          description: Запит прийнято
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/company:
    get:
      tags: [Users]
      operationId: getMyCompany
      summary: Реквізити компанії
      responses:
        '200':
          description: Реквізити
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      operationId: upsertMyCompany
      summary: Створення або заміна реквізитів
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyProfileInput'
      responses:
        '200':
          description: Реквізити збережено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /users/me/files:
    get:
      tags: [Users]
      operationId: listMyFiles
      summary: Мої файли
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/FileKind'
      responses:
        '200':
          description: Файли
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'

  /users/me/earnings:
    get:
      tags: [Users]
      operationId: getMyEarnings
      summary: Винагорода автора
      responses:
        '200':
          description: Нарахування
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Earnings'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/stats:
    get:
      tags: [Users]
      operationId: getMyStats
      summary: Статистика автора
      responses:
        '200':
          description: Статистика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorStats'

  /notifications:
    get:
      tags: [Users]
      operationId: listMyNotifications
      summary: Сповіщення
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Сповіщення
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'

  /notifications/{notificationId}:
    patch:
      tags: [Users]
      operationId: markNotificationRead
      summary: Позначити сповіщення прочитаним
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read:
                  type: boolean
                  enum: [true]
      responses:
        '200':
          description: Оновлене сповіщення
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'

  /notifications/read-all:
    post:
      tags: [Users]
      operationId: markAllNotificationsRead
      summary: Позначити всі сповіщення прочитаними
      responses:
        '204':
          description: Готово

  /config:
    get:
      tags: [Config]
      operationId: getPublicConfig
      summary: Публічна конфігурація для frontend
      security: []
      responses:
        '200':
          description: Шрифти, ліміти, версії текстів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'

  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Категорії каталогу
      security: []
      responses:
        '200':
          description: Категорії
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Каталог товарів
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc, popular]
            default: newest
      responses:
        '200':
          description: Товари
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'

  /products/{productId}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Картка товару
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Товар
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

  /designs:
    get:
      tags: [Catalog]
      operationId: listDesigns
      summary: Опубліковані авторські дизайни
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - name: authorId
          in: query
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, popular]
            default: newest
      responses:
        '200':
          description: Дизайни
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignList'
    post:
      tags: [Designs]
      operationId: createDesign
      summary: Створити чернетку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignCreateRequest'
      responses:
        '201':
          description: Чернетка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Design'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /designs/mine:
    get:
      tags: [Designs]
      operationId: listMyDesigns
      summary: Мої дизайни
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DesignStatus'
      responses:
        '200':
          description: Дизайни
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignList'

  /designs/{designId}:
    get:
      tags: [Catalog, Designs]
      operationId: getDesign
      summary: Картка дизайну
      description: Опублікований дизайн доступний усім. Чернетка або rejected доступні власнику та персоналу.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DesignId'
      responses:
        '200':
          description: Дизайн
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Design'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Designs]
      operationId: updateDesign
      summary: Оновити чернетку або rejected дизайн
      parameters:
        - $ref: '#/components/parameters/DesignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignUpdateRequest'
      responses:
        '200':
          description: Оновлений дизайн
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Design'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Designs]
      operationId: deleteDesign
      summary: Видалити чернетку або rejected дизайн
      parameters:
        - $ref: '#/components/parameters/DesignId'
      responses:
        '204':
          description: Видалено
        '409':
          $ref: '#/components/responses/Conflict'

  /designs/{designId}/fork:
    post:
      tags: [Designs]
      operationId: forkDesign
      summary: Взяти опублікований дизайн за основу
      parameters:
        - $ref: '#/components/parameters/DesignId'
      responses:
        '201':
          description: Приватна чернетка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Design'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /designs/{designId}/publish:
    post:
      tags: [Designs]
      operationId: publishDesign
      summary: Подати дизайн на модерацію
      description: |
        Створює незмінну версію дизайну зі статусом pending_moderation.
        Повторна публікація вже опублікованого дизайну повертає 409.
        Щоб змінити опублікований макет, створіть новий дизайн через fork.
      parameters:
        - $ref: '#/components/parameters/DesignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignPublishRequest'
      responses:
        '200':
          description: Дизайн у черзі модерації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Design'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /designs/{designId}/stats:
    get:
      tags: [Designs]
      operationId: getDesignStats
      summary: Статистика дизайну
      parameters:
        - $ref: '#/components/parameters/DesignId'
      responses:
        '200':
          description: Статистика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignStats'
        '403':
          $ref: '#/components/responses/Forbidden'

  /designs/{designId}/versions:
    get:
      tags: [Designs]
      operationId: listDesignVersions
      summary: Історія версій дизайну
      description: |
        Власник бачить усі версії, включно зі знімками замовлень.
        Персонал бачить усі версії. Endpoint призначений для кабінету
        автора та модерації, публічний каталог його не викликає.
      parameters:
        - $ref: '#/components/parameters/DesignId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Версії
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignVersionList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /designs/{designId}/reports:
    post:
      tags: [Designs]
      operationId: reportDesign
      summary: Поскаржитися на дизайн
      parameters:
        - $ref: '#/components/parameters/DesignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignReportRequest'
      responses:
        '201':
          description: Скаргу створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '409':
          $ref: '#/components/responses/Conflict'

  /personalization/lists:
    post:
      tags: [Personalization]
      operationId: createPersonalizationList
      summary: Розібрати CSV/XLSX зі списком імен
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalizationCreateRequest'
      responses:
        '201':
          description: Список
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalizationList'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /personalization/lists/{listId}:
    get:
      tags: [Personalization]
      operationId: getPersonalizationList
      summary: Список імен
      parameters:
        - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalizationList'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Personalization]
      operationId: deletePersonalizationList
      summary: Видалити список
      parameters:
        - $ref: '#/components/parameters/ListId'
      responses:
        '204':
          description: Видалено
        '409':
          $ref: '#/components/responses/Conflict'

  /personalization/lists/{listId}/validate:
    post:
      tags: [Personalization]
      operationId: validatePersonalizationList
      summary: Перевірити найдовше ім'я у зоні друку
      parameters:
        - $ref: '#/components/parameters/ListId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalizationValidateRequest'
      responses:
        '200':
          description: Результат перевірки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalizationValidation'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /uploads:
    post:
      tags: [Uploads]
      operationId: createUpload
      summary: Отримати signed URL для завантаження
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: Квиток на завантаження
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /uploads/{uploadId}:
    get:
      tags: [Uploads]
      operationId: getUpload
      summary: Статус завантаження
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: Файл
          content:
            application/json:
              schema:
