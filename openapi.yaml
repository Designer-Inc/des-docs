              schema:
                $ref: '#/components/schemas/AdminOrder'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/orders/{orderId}/status:
    patch:
      tags: [Admin]
      operationId: adminUpdateOrderStatus
      summary: Змінити статус замовлення
      x-required-roles: [admin, super_admin]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOrderStatusRequest'
      responses:
        '200':
          description: Замовлення
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/orders/{orderId}/mark-paid:
    post:
      tags: [Admin]
      operationId: adminMarkOrderPaid
      summary: Підтвердити банківський переказ
      x-required-roles: [admin, super_admin]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkPaidRequest'
      responses:
        '200':
          description: Замовлення
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/orders/{orderId}/refund:
    post:
      tags: [Admin]
      operationId: adminRefundOrder
