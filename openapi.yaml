      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '200':
          description: Замовлення
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/orders/{orderId}/shipment:
    post:
      tags: [Admin]
      operationId: adminCreateShipment
      summary: Створити ЕН Нової Пошти
      x-required-roles: [admin, super_admin]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
      responses:
        '201':
          description: Відправлення
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/orders/{orderId}/print-jobs:
    get:
      tags: [Admin]
      operationId: adminListOrderPrintJobs
      summary: Черга друку замовлення
      x-required-roles: [admin, super_admin]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrintJob'
    post:
      tags: [Admin]
      operationId: adminCreatePrintJob
      summary: Поставити замовлення в чергу друку
      x-required-roles: [admin, super_admin]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '202':
          description: Job створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/print-jobs/{jobId}/retry:
    post:
      tags: [Admin]
      operationId: adminRetryPrintJob
      summary: Повторити генерацію
      x-required-roles: [admin, super_admin]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: Job у черзі
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/print-queue:
    get:
      tags: [Admin]
      operationId: adminListPrintQueue
      summary: Плоский список черги друку
      x-required-roles: [admin, super_admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: fabricType
          in: query
          schema:
            type: string
        - name: color
          in: query
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: string
        - name: printJobStatus
          in: query
          schema:
            $ref: '#/components/schemas/PrintJobStatus'
      responses:
        '200':
          description: Позиції
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintQueueList'

  /admin/print-queue/groups:
    get:
      tags: [Admin]
      operationId: adminGroupPrintQueue
      summary: Групування за тканиною, кольором, розміром
      x-required-roles: [admin, super_admin]
      parameters:
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [fabric, color, size, product]
            default: fabric
      responses:
        '200':
          description: Групи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintQueueGroupList'

  /admin/order-items/{orderItemId}/print-files:
    get:
      tags: [Admin]
      operationId: adminListOrderItemPrintFiles
      summary: Файли друку позиції
      x-required-roles: [admin, super_admin]
      parameters:
        - $ref: '#/components/parameters/OrderItemId'
      responses:
        '200':
          description: Файли
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrintFile'
    post:
      tags: [Admin]
      operationId: adminAddPrintFile
      summary: Додати прямий або дзеркальний файл
      x-required-roles: [admin, super_admin]
      parameters:
        - $ref: '#/components/parameters/OrderItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPrintFileRequest'
      responses:
        '201':
          description: Файл
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintFile'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/stats:
    get:
      tags: [Admin]
      operationId: adminGetStats
      summary: Дашборд
      x-required-roles: [admin, super_admin]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Метрики
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'

  /admin/audit-logs:
    get:
      tags: [Admin]
      operationId: adminListAuditLogs
      summary: Журнал дій
      x-required-roles: [admin, super_admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: entityType
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Журнал
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DesignId:
      name: designId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ListId:
      name: listId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderItemId:
      name: orderItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Некоректний запит
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Немає або недійсний токен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Недостатньо прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Не знайдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфлікт стану або дубль
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Бізнес-правило не виконано
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Файл завеликий
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Формат файлу не підтримується
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Перевищено ліміт
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Зовнішній сервіс недоступний
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - OUT_OF_STOCK
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - RATE_LIMITED
            - DPI_TOO_LOW
            - PERSONALIZATION_MISMATCH
            - PAYMENT_FAILED
            - COMPANY_PROFILE_INCOMPLETE
            - INVALID_STATUS_TRANSITION
            - DESIGN_NOT_ORDERABLE
            - INTERNAL_ERROR
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationDetail'
        requestId:
          type: string

    ValidationDetail:
      type: object
      required: [message]
      properties:
        field:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    Health:
      type: object
      required: [status, version, timestamp, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [ok, error]

    PageMeta:
      type: object
      required: [page, limit, total, hasMore]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean

    UserRole:
      type: string
      enum: [customer, moderator, admin, super_admin]

    UserStatus:
      type: string
      enum: [active, blocked, deleted]

    DesignStatus:
      type: string
      enum: [draft, pending_moderation, published, rejected, hidden, archived]

    OrderStatus:
      type: string
      enum:
        - pending_payment
        - paid
        - on_moderation
        - in_production
        - ready_to_ship
        - shipped
        - delivered
        - cancelled
        - refunded

    PaymentStatus:
      type: string
      enum: [pending, success, failed, refunded]

    PaymentMethod:
      type: string
      enum: [card, bank_transfer]

    PaymentProvider:
      type: string
      enum: [liqpay, wayforpay, bank_transfer]

    FileKind:
      type: string
      enum:
        - artwork
        - vector
        - brand_asset
        - personalization_list
        - print_file
        - product_image
        - preview
        - invoice

    FileStatus:
      type: string
      enum: [pending, ready, failed, deleted]

    FileVisibility:
      type: string
      enum: [public, private]

    PrintJobStatus:
      type: string
      enum: [queued, processing, ready, failed]

    PrintFileStatus:
      type: string
      enum: [pending, ready, failed]

    PrintFileKind:
      type: string
      enum: [direct, mirrored]

    ReportStatus:
      type: string
      enum: [open, reviewing, resolved, dismissed]

    ReportReason:
      type: string
      enum: [copyright, offensive, illegal, spam, other]

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
        - acceptTerms
        - acceptPrivacy
        - termsVersion
        - privacyVersion
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          pattern: '^(?=.*[0-9]).{8,72}$'
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          nullable: true
        locale:
          type: string
          enum: [uk, en]
          default: uk
        acceptTerms:
          type: boolean
          enum: [true]
        acceptPrivacy:
          type: boolean
          enum: [true]
        termsVersion:
          type: string
        privacyVersion:
          type: string

    RegisterResponse:
      type: object
      required: [user, requiresEmailConfirmation, permissions]
      properties:
        user:
          $ref: '#/components/schemas/User'
        requiresEmailConfirmation:
          type: boolean
        accessToken:
          type: string
          nullable: true
        expiresIn:
          type: integer
          nullable: true
        permissions:
          type: array
          items:
            type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user, permissions]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/User'
        permissions:
          type: array
          items:
            type: string

    RefreshResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer

    User:
      type: object
      required: [id, email, fullName, role, status, locale, permissions, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        locale:
          type: string
          enum: [uk, en]
        avatarUrl:
          type: string
          format: uri
          nullable: true
        permissions:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    UserSummary:
      type: object
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true

    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          nullable: true
        locale:
          type: string
          enum: [uk, en]
        avatarFileId:
          type: string
          format: uuid
          nullable: true

    CompanyProfile:
      type: object
      required:
        - userId
        - companyName
        - legalName
        - taxId
        - iban
        - bankName
        - legalAddress
        - contactName
        - contactPhone
        - contactEmail
        - isVerified
      properties:
        userId:
          type: string
          format: uuid
        companyName:
          type: string
        legalName:
          type: string
        taxId:
          type: string
        iban:
          type: string
        bankName:
          type: string
        legalAddress:
          type: string
        contactName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
          format: email
        isVerified:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    CompanyProfileInput:
      type: object
      required:
        - companyName
        - legalName
        - taxId
        - iban
        - bankName
        - legalAddress
        - contactName
        - contactPhone
        - contactEmail
      properties:
        companyName:
          type: string
          minLength: 2
          maxLength: 200
        legalName:
          type: string
          minLength: 2
          maxLength: 200
        taxId:
          type: string
          minLength: 8
          maxLength: 12
        iban:
          type: string
          minLength: 15
          maxLength: 34
        bankName:
          type: string
          minLength: 2
          maxLength: 200
        legalAddress:
          type: string
          minLength: 5
          maxLength: 300
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        contactPhone:
          type: string
          minLength: 10
          maxLength: 20
        contactEmail:
          type: string
          format: email

    File:
      type: object
      required: [id, kind, status, visibility, originalName, mimeType, sizeBytes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/FileKind'
        status:
          $ref: '#/components/schemas/FileStatus'
        visibility:
          $ref: '#/components/schemas/FileVisibility'
        originalName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        widthPx:
          type: integer
          nullable: true
        heightPx:
          type: integer
          nullable: true
        dpi:
          type: integer
          nullable: true
        checksumSha256:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
        urlExpiresAt:
          type: string
          format: date-time
          nullable: true
        lockedAt:
          type: string
          format: date-time
          nullable: true
          description: Файл використано в незмінній версії або замовленні, видалення заборонене.
        createdAt:
          type: string
          format: date-time

    UploadRequest:
      type: object
      required: [kind, filename, mimeType, sizeBytes]
      properties:
        kind:
          type: string
          enum:
            - artwork
            - vector
            - brand_asset
            - personalization_list
            - print_file
            - product_image
            - preview
        filename:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 209715200

    UploadTicket:
      type: object
      required: [uploadId, fileId, uploadUrl, method, headers, expiresAt]
      properties:
        uploadId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time

    CompleteUploadRequest:
      type: object
      properties:
        checksumSha256:
          type: string

    FileList:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/File'

    Earnings:
      type: object
      required: [currency, accruedMinor, paidMinor, pendingMinor, items]
      properties:
        currency:
          type: string
          example: UAH
        accruedMinor:
          type: integer
        paidMinor:
          type: integer
        pendingMinor:
          type: integer
        items:
          type: array
          items:
            type: object
            required: [designId, designTitle, amountMinor, status, createdAt]
            properties:
              designId:
                type: string
                format: uuid
              designTitle:
                type: string
              amountMinor:
                type: integer
              status:
                type: string
                enum: [accrued, paid, void]
              createdAt:
                type: string
                format: date-time

    AuthorStats:
      type: object
      required: [designs, publishedDesigns, totalViews, totalOrders, totalCopies, accruedMinor, paidMinor]
      properties:
        designs:
          type: integer
        publishedDesigns:
          type: integer
        totalViews:
          type: integer
          format: int64
        totalOrders:
          type: integer
          format: int64
        totalCopies:
          type: integer
          format: int64
        accruedMinor:
          type: integer
        paidMinor:
          type: integer

    Notification:
      type: object
      required: [id, type, title, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [order_status, payment, moderation, report, invoice, system]
        title:
          type: string
        body:
          type: string
        data:
          type: object
          additionalProperties: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    NotificationList:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Notification'

    PublicConfig:
      type: object
      required:
        - currency
        - locales
        - defaultLocale
        - fonts
        - textColors
        - limits
        - designDisclaimerVersion
        - termsVersion
        - privacyVersion
        - paymentMethods
        - deliveryProviders
        - fileRules
      properties:
        currency:
          type: string
          example: UAH
        locales:
          type: array
          items:
            type: string
            enum: [uk, en]
        defaultLocale:
          type: string
          enum: [uk, en]
        fonts:
          type: array
          minItems: 5
          maxItems: 5
          description: Рівно 5 захардкожених шрифтів, усі з кирилицею.
          items:
            $ref: '#/components/schemas/Font'
        textColors:
          type: array
          items:
            type: string
            example: '#111111'
        limits:
          $ref: '#/components/schemas/Limits'
        designDisclaimerVersion:
          type: string
        termsVersion:
          type: string
        privacyVersion:
          type: string
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        deliveryProviders:
          type: array
          items:
            type: string
            enum: [nova_poshta]
        fileRules:
          type: array
          items:
            $ref: '#/components/schemas/FileRule'

    FileRule:
      type: object
      required: [kind, mimeTypes, maxBytes]
      properties:
        kind:
          type: string
          enum:
            - artwork
            - vector
            - brand_asset
            - personalization_list
            - print_file
            - product_image
            - preview
        mimeTypes:
          type: array
          items:
            type: string
        maxBytes:
          type: integer

    FontId:
      type: string
      enum: [inter, montserrat, pt_serif, bitter, caveat]
      description: |
        П'ять захардкожених шрифтів. Усі підтримують кирилицю та латиницю.
        inter: sans; montserrat: sans; pt_serif: serif;
        bitter: slab serif; caveat: handwriting.

    FontFile:
      type: object
      required: [url, weight, style]
      properties:
        url:
          type: string
          format: uri
        weight:
          type: integer
          minimum: 100
          maximum: 900
        style:
          type: string
          enum: [normal, italic]
        format:
          type: string
          enum: [truetype, opentype]
          default: truetype

    Font:
      type: object
      required: [id, family, files, supportsCyrillic]
      properties:
        id:
          $ref: '#/components/schemas/FontId'
        family:
          type: string
        files:
          type: array
          minItems: 1
          description: TTF/OTF-файли для frontend і print-worker. Однакові файли в обох.
          items:
            $ref: '#/components/schemas/FontFile'
        supportsCyrillic:
          type: boolean

    Limits:
      type: object
      required:
        - maxArtworkBytes
        - maxVectorBytes
        - maxPrintFileBytes
        - maxPersonalizationBytes
        - maxNames
        - maxTextLength
        - minDpi
        - warningDpi
      properties:
        maxArtworkBytes:
          type: integer
          example: 20971520
        maxVectorBytes:
          type: integer
          example: 52428800
        maxPrintFileBytes:
          type: integer
          example: 209715200
        maxPersonalizationBytes:
          type: integer
          example: 5242880
        maxNames:
          type: integer
          example: 500
        maxTextLength:
          type: integer
          example: 100
        minDpi:
          type: integer
          example: 72
        warningDpi:
          type: integer
          example: 150

    Category:
      type: object
      required: [id, name, slug, position, isActive]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        position:
          type: integer
        isActive:
          type: boolean

    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description:
          type: string
          nullable: true
        position:
          type: integer
          default: 0
        isActive:
          type: boolean
          default: true

    ProductSummary:
      type: object
      required: [id, name, slug, basePriceMinor, currency, isActive]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        basePriceMinor:
          type: integer
        currency:
          type: string
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        productionMethod:
          type: string
          enum: [dtg, dtf, sublimation]
        fabricType:
          type: string
          nullable: true
        isActive:
          type: boolean

    Product:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [description, isCustomizable, images, variants, printAreas, discountTiers]
          properties:
            description:
              type: string
              nullable: true
            isCustomizable:
              type: boolean
            images:
              type: array
              items:
                $ref: '#/components/schemas/ProductImage'
            variants:
              type: array
              items:
                $ref: '#/components/schemas/ProductVariant'
            printAreas:
              type: array
              items:
                $ref: '#/components/schemas/PrintArea'
            discountTiers:
              type: array
              items:
                $ref: '#/components/schemas/DiscountTier'

    ProductVariant:
      type: object
      required: [id, sku, colorName, colorHex, size, priceDeltaMinor, stockQuantity, isActive]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        colorName:
          type: string
        colorHex:
          type: string
        size:
          type: string
        priceDeltaMinor:
          type: integer
        stockQuantity:
          type: integer
        mockupUrl:
          type: string
          format: uri
          nullable: true
        isActive:
          type: boolean

    PrintArea:
      type: object
      required:
        - id
        - name
        - widthMm
        - heightMm
        - offsetXMm
        - offsetYMm
        - mockupPxPerMm
        - minDpi
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        widthMm:
          type: number
          format: float
          description: Ширина зони друку в міліметрах.
        heightMm:
          type: number
          format: float
          description: Висота зони друку в міліметрах.
        offsetXMm:
          type: number
          format: float
          description: Зсув X від лівого верхнього кута mockup-зображення, у мм.
        offsetYMm:
          type: number
          format: float
          description: Зсув Y від лівого верхнього кута mockup-зображення, у мм.
        mockupPxPerMm:
          type: number
          format: float
          description: |
            Скільки пікселів mockup-зображення припадає на 1 мм.
            Усі варіанти товару мають використовувати mockup одного масштабу.
        minDpi:
          type: integer

    ProductImage:
      type: object
      required: [id, url, position]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        alt:
          type: string
          nullable: true
        position:
          type: integer

    DiscountTier:
      type: object
      required: [id, minQuantity, discountPercent, isActive]
      properties:
        id:
          type: string
          format: uuid
        minQuantity:
          type: integer
        discountPercent:
          type: number
          format: float
        isActive:
          type: boolean

    ProductList:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProductSummary'

    ProductAggregateInput:
      type: object
      required: [name, categoryId, basePriceMinor, variants, printAreas]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 140
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        categoryId:
          type: string
          format: uuid
        description:
          type: string
          nullable: true
        basePriceMinor:
          type: integer
          minimum: 0
        currency:
          type: string
          default: UAH
        productionMethod:
          type: string
          enum: [dtg, dtf, sublimation]
          default: dtg
        fabricType:
          type: string
          nullable: true
        isActive:
          type: boolean
          default: true
        isCustomizable:
          type: boolean
          default: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImageInput'
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductVariantInput'
        printAreas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PrintAreaInput'
        discountTiers:
          type: array
          items:
            $ref: '#/components/schemas/DiscountTierInput'
      example:
        name: Eco Tote
        slug: eco-tote
        categoryId: c0000000-0000-0000-0000-000000000004
        description: Містка бавовняна сумка для кастомного друку.
        basePriceMinor: 42000
        currency: UAH
        productionMethod: dtf
        fabricType: canvas
        isActive: true
        isCustomizable: true
        images: []
        variants:
          - sku: TOTE-NAT-OS
            colorName: Natural
            colorHex: "#d9c7a3"
            size: One size
            priceDeltaMinor: 0
            stockQuantity: 30
            isActive: true
        printAreas:
          - name: front
            widthMm: 300
            heightMm: 350
            offsetXMm: 100
            offsetYMm: 150
            mockupPxPerMm: 2.5
            minDpi: 150
        discountTiers:
          - minQuantity: 10
            discountPercent: 5
            isActive: true

    ProductImageInput:
      type: object
      required: [fileId, position]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        fileId:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        alt:
          type: string
          nullable: true

    ProductVariantInput:
      type: object
      required: [sku, colorName, colorHex, size, stockQuantity]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        sku:
          type: string
        colorName:
          type: string
        colorHex:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        size:
          type: string
        priceDeltaMinor:
          type: integer
          default: 0
        stockQuantity:
          type: integer
          minimum: 0
        mockupFileId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
          default: true

    PrintAreaInput:
      type: object
      required: [name, widthMm, heightMm]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        widthMm:
          type: number
          minimum: 1
        heightMm:
          type: number
          minimum: 1
        offsetXMm:
          type: number
          default: 0
          description: Зсув X зони друку від лівого верхнього кута mockup, у мм.
        offsetYMm:
          type: number
          default: 0
          description: Зсув Y зони друку від лівого верхнього кута mockup, у мм.
        mockupPxPerMm:
          type: number
          minimum: 0.1
          default: 3.7795
          description: |
            Калібрування mockup: пікселів на міліметр. 96 DPI = 3.7795.
            Усі кольорові варіанти товару мають мати mockup однакового розміру.
        minDpi:
          type: integer
          minimum: 72
          default: 150

    DiscountTierInput:
      type: object
      required: [minQuantity, discountPercent]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        minQuantity:
          type: integer
          minimum: 1
        discountPercent:
          type: number
          minimum: 0
          maximum: 100
        isActive:
          type: boolean
          default: true

    CanvasObjectBase:
      type: object
      required: [id, left, top, angle, scaleX, scaleY, zIndex]
      properties:
        id:
          type: string
          description: Унікальний ID об'єкта в межах canvas.
        left:
          type: number
          description: Позиція X у пікселях canvas, від верхнього лівого кута зони друку.
        top:
          type: number
          description: Позиція Y у пікселях canvas, від верхнього лівого кута зони друку.
        scaleX:
          type: number
          minimum: 0.01
          default: 1
        scaleY:
          type: number
          minimum: 0.01
          default: 1
        angle:
          type: number
          minimum: -360
          maximum: 360
          default: 0
          description: |
            Будь-який кут повороту в градусах. Рендерер нормалізує його
            до діапазону [0, 360), тому 370 і 10 дають однаковий результат.
        zIndex:
          type: integer
          minimum: 0
          description: Порядок шарів, більше значення вище.
        opacity:
          type: number
          minimum: 0
          maximum: 1
          default: 1
        visible:
          type: boolean
          default: true
        flipX:
          type: boolean
          default: false
        flipY:
          type: boolean
          default: false
        locked:
          type: boolean
          default: false
      additionalProperties: true

    ImageObject:
      allOf:
        - $ref: '#/components/schemas/CanvasObjectBase'
        - type: object
          required: [type, fileId, width, height]
          properties:
            type:
              type: string
              enum: [image]
            fileId:
              type: string
              format: uuid
              description: Канонічне посилання на files.id. Обов'язкове.
            width:
              type: number
              minimum: 0.01
              description: Ширина в пікселях canvas.
            height:
              type: number
              minimum: 0.01
              description: Висота в пікселях canvas.
            src:
              type: string
              format: uri
              nullable: true
              description: URL для рендера в браузері. Backend для друку використовує fileId, не src.
            cropX:
              type: number
              default: 0
            cropY:
              type: number
              default: 0
      description: |
        Растрове або SVG зображення. На одному canvas можна мати кілька
        ImageObject, кожен з власними position, scale, angle, flip і zIndex.

    TextboxObject:
      allOf:
        - $ref: '#/components/schemas/CanvasObjectBase'
        - type: object
          required:
            - type
            - text
            - fontFamily
            - fontSize
            - width
            - height
            - textAlign
            - lineHeight
          properties:
            type:
              type: string
              enum: [textbox]
            text:
              type: string
              minLength: 1
              maxLength: 100
            fontFamily:
              $ref: '#/components/schemas/FontId'
            fontSize:
              type: number
              minimum: 8
              maximum: 200
              default: 24
              description: Розмір шрифту в пікселях canvas.
            width:
              type: number
              minimum: 0.01
              description: Ширина textbox у пікселях canvas.
            height:
              type: number
              minimum: 0.01
              description: Висота textbox у пікселях canvas, після переносу тексту.
            fontWeight:
              type: integer
              minimum: 100
              maximum: 900
              default: 400
            fontStyle:
              type: string
              enum: [normal, italic]
              default: normal
            fill:
              type: string
              default: '#111111'
            textAlign:
              type: string
              enum: [left, center, right, justify]
              default: left
            lineHeight:
              type: number
              minimum: 0.8
              maximum: 2.5
              default: 1.16
            charSpacing:
              type: number
              minimum: -200
              maximum: 1000
              default: 0
              description: Міжлітерний інтервал у 1/1000 em, як у Fabric.js.
            padding:
              type: number
              minimum: 0
              maximum: 100
              default: 4
              description: Внутрішній відступ textbox у пікселях canvas.
            splitByGrapheme:
              type: boolean
              default: true
            autoWrap:
              type: boolean
              default: true
      description: |
        Smart textbox: переносить текст у межах width/height, підтримує
        вирівнювання, міжрядковий інтервал, міжлітерний інтервал, жирність,
        курсив, колір, padding і ті самі transform-властивості, що image.

    ShapeObject:
      allOf:
        - $ref: '#/components/schemas/CanvasObjectBase'
        - type: object
          required: [type, shape]
          properties:
            type:
              type: string
              enum: [shape]
            shape:
              type: string
              enum: [rect, circle, triangle, line, path]
            width:
              type: number
              minimum: 0.01
              description: Ширина в пікселях canvas.
            height:
              type: number
              minimum: 0.01
              description: Висота в пікселях canvas.
            fill:
              type: string
              nullable: true
            stroke:
              type: string
              nullable: true
            strokeWidth:
              type: number
              minimum: 0
              default: 0

    DesignCanvasObject:
      oneOf:
        - $ref: '#/components/schemas/ImageObject'
        - $ref: '#/components/schemas/TextboxObject'
        - $ref: '#/components/schemas/ShapeObject'
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/ImageObject'
          textbox: '#/components/schemas/TextboxObject'
          shape: '#/components/schemas/ShapeObject'

    DesignCanvas:
      type: object
      required: [version, unit, printAreaId, widthMm, heightMm, pxPerMm, objects]
      properties:
        version:
          type: string
          example: fabric@6
        unit:
          type: string
          enum: [px]
          default: px
          description: |
            Усі координати та розміри об'єктів на canvas задані в пікселях canvas.
            Міліметри отримуються як px / pxPerMm.
        printAreaId:
          type: string
          format: uuid
        widthMm:
          type: number
          description: Ширина canvas у мм. Має дорівнювати PrintArea.widthMm.
        heightMm:
          type: number
          description: Висота canvas у мм. Має дорівнювати PrintArea.heightMm.
        pxPerMm:
          type: number
          description: |
            Пікселів canvas на 1 мм. Для 96 DPI використовуйте 3.7795.
            Print worker масштабує в 300 DPI: printPx = mm × 300 / 25.4.
        objects:
          type: array
          maxItems: 20
          description: |
            До 20 об'єктів на canvas (NFR-03). Кілька ImageObject і TextboxObject
            дозволені; кожен має власні transform, angle, scale і zIndex.
          items:
            $ref: '#/components/schemas/DesignCanvasObject'
      example:
        version: fabric@6
        unit: px
        printAreaId: e0000000-0000-0000-0000-000000000001
        widthMm: 300
        heightMm: 400
        pxPerMm: 3.7795
        objects:
          - type: textbox
            id: txt-hello
            text: HELLO
            fontFamily: inter
            fontSize: 80
            fontWeight: 700
            fontStyle: normal
            fill: "#111111"
            textAlign: center
            lineHeight: 1.1
            charSpacing: 0
            padding: 0
            splitByGrapheme: true
            autoWrap: true
            left: 100
            top: 100
            width: 400
            height: 120
            scaleX: 1
            scaleY: 1
            angle: 15
            zIndex: 1
      additionalProperties: true

    DesignSummary:
      type: object
      required:
        - id
        - title
        - status
        - baseProduct
        - printAreaId
        - author
        - viewCount
        - orderCount
        - copiesCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/DesignStatus'
        previewUrl:
          type: string
          format: uri
          nullable: true
        baseProduct:
          $ref: '#/components/schemas/ProductSummary'
        printAreaId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserSummary'
        viewCount:
          type: integer
          format: int64
        orderCount:
          type: integer
          format: int64
        copiesCount:
          type: integer
          format: int64
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Design:
      allOf:
        - $ref: '#/components/schemas/DesignSummary'
        - type: object
          properties:
            authorBonusPercent:
              type: number
              readOnly: true
              description: Видимий лише власнику та персоналу.
            currentVersionId:
              type: string
              format: uuid
              nullable: true
              readOnly: true
              description: Опублікована версія, яку використовують нові замовлення.
            canvas:
              type: object
              allOf:
                - $ref: '#/components/schemas/DesignCanvas'
              nullable: true
            rejectionReason:
              type: string
              nullable: true
            hiddenReason:
              type: string
              nullable: true
            rightsConfirmedAt:
              type: string
              format: date-time
              nullable: true
            rightsDocumentVersion:
              type: string
              nullable: true
              description: Версія тексту підтвердження прав, видима власнику та персоналу.
            forkedFromId:
              type: string
              format: uuid
              nullable: true
            files:
              type: array
              items:
                $ref: '#/components/schemas/DesignFile'

    DesignFile:
      type: object
      required: [fileId, role, url, mimeType]
      properties:
        fileId:
          type: string
          format: uuid
        role:
          type: string
          enum: [artwork, preview, print_ready, vector]
        url:
          type: string
          format: uri
        mimeType:
          type: string
        widthPx:
          type: integer
          nullable: true
        heightPx:
          type: integer
          nullable: true
        dpi:
          type: integer
          nullable: true

    DesignList:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
