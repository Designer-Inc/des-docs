    PrintFile:
      type: object
      required: [id, orderItemId, kind, status, personalizationIndex, createdAt]
      properties:
        id:
          type: string
          format: uuid
        orderItemId:
          type: string
          format: uuid
        designVersionId:
          type: string
          format: uuid
          nullable: true
          description: Версія, з якої згенеровано файл.
        kind:
          $ref: '#/components/schemas/PrintFileKind'
        status:
          $ref: '#/components/schemas/PrintFileStatus'
        personalizedName:
          type: string
          nullable: true
        personalizationIndex:
          type: integer
        fileUrl:
          type: string
          format: uri
          nullable: true
        error:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AddPrintFileRequest:
      type: object
      required: [fileId, kind]
      properties:
        fileId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/PrintFileKind'
        personalizedName:
          type: string
          nullable: true
        personalizationIndex:
          type: integer
          minimum: 0
          default: 0

    PrintQueueItem:
      type: object
      required:
        - orderId
        - orderNumber
        - orderItemId
        - productName
        - variantName
        - quantity
        - readyFiles
        - totalFiles
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
        orderItemId:
          type: string
          format: uuid
        productName:
          type: string
        variantName:
          type: string
        fabricType:
          type: string
          nullable: true
        colorName:
          type: string
        size:
          type: string
        quantity:
          type: integer
        designTitle:
          type: string
          nullable: true
        previewUrl:
          type: string
          format: uri
          nullable: true
        printJobStatus:
          $ref: '#/components/schemas/PrintJobStatus'
        readyFiles:
          type: integer
        totalFiles:
          type: integer

    PrintQueueList:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PrintQueueItem'

    PrintQueueGroup:
      type: object
      required: [key, label, count, orderItemIds]
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer
        orderItemIds:
          type: array
          items:
            type: string
            format: uuid

    PrintQueueGroupList:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PrintQueueGroup'

    AdminStats:
      type: object
      required:
        - ordersToday
        - ordersMonth
        - revenueMonthMinor
        - aovMinor
        - pendingModerationDesigns
        - pendingModerationOrders
        - printJobsQueued
        - printJobsFailed
        - lowStockVariants
        - topProducts
        - topDesigns
      properties:
        ordersToday:
          type: integer
        ordersMonth:
          type: integer
        revenueMonthMinor:
          type: integer
        aovMinor:
          type: integer
        pendingModerationDesigns:
          type: integer
        pendingModerationOrders:
          type: integer
        printJobsQueued:
          type: integer
        printJobsFailed:
          type: integer
        lowStockVariants:
          type: integer
        topProducts:
          type: array
          items:
            type: object
            required: [id, name, orders]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              orders:
                type: integer
        topDesigns:
          type: array
          items:
            type: object
            required: [id, title, orders]
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              orders:
                type: integer

    AuditLog:
      type: object
      required: [id, action, entityType, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: object
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
          nullable: true
        before:
          type: object
          additionalProperties: true
          nullable: true
        after:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time

    AuditLogList:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditLog'

    SearchResponse:
      type: object
      required: [query, products, designs, totalProducts, totalDesigns]
      properties:
        query:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        designs:
          type: array
          items:
            $ref: '#/components/schemas/DesignSummary'
        totalProducts:
          type: integer
        totalDesigns:
          type: integer
